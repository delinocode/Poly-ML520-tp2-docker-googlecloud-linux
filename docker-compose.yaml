name: inferapi

# This file runs two containers on one network: the service, and a client that talks
# to it.
#
#   docker compose up --build

services:
  # TODO(LAB): write the inferapi service. Make sure:
  #    - Listens on port 8000, reachable from host
  #    - Token comes from env
  #    - Contains a healtcheck
  inferapi:
    image: northamerica-northeast1-docker.pkg.dev/tp2-group-u/ml520/inferapi:0.2.0
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------
  loadgen:
    image: python:3.12-slim
    depends_on:
      inferapi:
        condition: service_healthy
    environment:
      TARGET_URL: http://inferapi:8000
      ML520_SECURITY__API_TOKEN: ${ML520_SECURITY__API_TOKEN:?set it in .env}
      PAYLOAD_GLOB: /app/scripts/payload*.json
      DELAY_S: "0.5"
    volumes:
      - type: bind
        source: scripts
        target: /app/scripts
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "/app/scripts/loadgen.py"]
